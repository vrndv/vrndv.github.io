<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress</title>
    <style>
        /* --- CSS Reset & Variables --- */
        :root {
            --bg-color: #0f0f0f;
            --text-color: #e0e0e0;
            --accent-color: #00d2ff; /* Cyan glow */
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* --- Layout --- */
        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-stack);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Main Container --- */
        .container {
            text-align: center;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        /* --- Typography --- */
        h1 {
            font-weight: 200;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-weight: 300;
            color: #888;
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
        }

        /* --- Animations --- */
        .loader {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto 2rem auto;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loader::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border-top: 1px solid var(--accent-color);
            animation: spin 2s linear infinite;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        /* Background Gradient Spot for depth */
        .glow-spot {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.05) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Keyframes */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="glow-spot"></div>

    <div class="container">
        <div class="loader"></div>
        
        <h1>Coming Soon</h1>
        <p>BUILT TO STAY PRIVATE.</p>
    </div>

</body>
</html>
